name: upper_case_cstr('world\n') == ('WORLD', '')
limit: 1000
memory_size: 0x1000
memory_mapped_io:
  0x80: [119, 111, 114, 108, 100, 10]   
  0x84: []                                 
reports:
  - name: Step-by-step
    slice: all
    view: |
      {pc}: {instruction} {pc:label}
  
  - name: Result
    slice: last
    view: |
      numio[0x80]: {io:0x80:sym}
      numio[0x84]: {io:0x84:sym}
      {memory:0:31}
    assert: |
      numio[0x80]: "" >>> ""
      numio[0x84]: "" >>> "WORLD"
      mem[0..31]: 	57 4f 52 4c 44 00 5f 5f 5f 5f 5f 5f 5f 5f 5f 5f 5f 5f 5f 5f 5f 5f 5f 5f 5f 5f 5f 5f 5f 5f 5f 5f
